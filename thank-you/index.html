<!-- ===================== Google Ads conversion =====================
     PLACEHOLDER. Fill both constants with the real values from
     Google Ads > Goals > Conversions > your conversion action > tag setup.
     Until they are filled the tag is inert — nothing loads and nothing fires. -->
<script>
  var GOOGLE_ADS_ID = '';          // e.g. 'AW-123456789'
  var GOOGLE_ADS_CONVERSION = '';  // e.g. 'AW-123456789/AbC-D_efGhIjKlMn'

  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }

  // Always push to the dataLayer so GTM can fire its own tag regardless.
  dataLayer.push({ event: 'lead_thank_you', page: 'short_pump_thank_you' });

  if (GOOGLE_ADS_ID) {
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GOOGLE_ADS_ID;
    document.head.appendChild(s);

    gtag('js', new Date());
    gtag('config', GOOGLE_ADS_ID);

    if (GOOGLE_ADS_CONVERSION) {
      gtag('event', 'conversion', { send_to: GOOGLE_ADS_CONVERSION });
    }
  }

  var yr = document.querySelector('[data-year]');
  if (yr) yr.textContent = String(new Date().getFullYear());
</script>
